<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>启动动画预览 · 使劲燃的钱</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #1a1a1c; color: #f3efe6; font-family: "HarmonyOS Sans SC", "PingFang SC", system-ui, sans-serif; }
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; }
  .stage-wrap { display: flex; gap: 28px; flex-wrap: wrap; justify-content: center; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .label { font-size: 13px; color: rgba(235,235,245,.62); letter-spacing: .08em; }
  .phone {
    position: relative; width: 390px; height: 844px; overflow: hidden; background: #000;
    border-radius: 22px; box-shadow: 0 18px 60px rgba(0,0,0,.55); isolation: isolate;
  }
  .phone img { display: block; }
  .home {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    opacity: 0; transform: scale(1.02); transform-origin: center;
  }
  .poster, .poster-blur, .poster-sharp {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
  }
  .poster { opacity: 0; transform: scale(1.06); transform-origin: center; }
  .poster-blur { filter: blur(38px); transform: scale(1.08); transform-origin: center; }
  .poster-sharp { opacity: 1; }
  .glow {
    position: absolute; left: 50%; top: 46%; width: 300px; height: 300px; border-radius: 50%;
    transform: translate(-50%, -50%) scale(.8);
    background: radial-gradient(circle, rgba(48,209,88,.38), rgba(48,209,88,.10) 38%, rgba(48,209,88,0) 70%);
    filter: blur(22px); opacity: .45; pointer-events: none;
  }
  .flare {
    position: absolute; left: 50%; top: 50%; width: 260px; height: 260px; border-radius: 50%;
    transform: translate(-50%, -50%) scale(.4);
    background: radial-gradient(circle, rgba(48,209,88,.5), rgba(48,209,88,0) 68%);
    filter: blur(18px); opacity: 0; pointer-events: none;
  }
  .icon {
    position: absolute; left: 50%; top: 50%; width: 104px; height: 104px;
    border-radius: 24px; object-fit: cover; transform: translate(-50%, -50%) scale(1);
    box-shadow: 0 14px 40px rgba(0,0,0,.55); transform-origin: center;
  }
  .controls { display: flex; gap: 10px; align-items: center; }
  button {
    appearance: none; border: 1px solid rgba(255,255,255,.16); border-radius: 999px;
    background: #2c2c2e; color: #fff; font: inherit; font-size: 13px; padding: 9px 16px; cursor: pointer;
  }
  button:hover { background: #3a3a3c; }
  input[type="range"] { width: 220px; accent-color: #30d158; }
  .time { font-variant-numeric: tabular-nums; font-size: 12px; color: rgba(235,235,245,.55); min-width: 58px; text-align: right; }
  .note { max-width: 820px; font-size: 12px; line-height: 1.7; color: rgba(235,235,245,.5); text-align: center; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="stage-wrap">
  <div class="col">
    <div class="label">V1 · 柔焦接力</div>
    <div class="phone" id="phone1">
      <img class="home" id="home1" src="home.png" alt="" />
      <img class="poster" id="poster1" src="poster.png" alt="" />
      <img class="icon" id="icon1" src="app-icon.png" alt="" />
    </div>
  </div>
  <div class="col">
    <div class="label">V2 · 景深拉焦</div>
    <div class="phone" id="phone2">
      <img class="home" id="home2" src="home.png" alt="" />
      <img class="poster-blur" id="posterBlur2" src="poster.png" alt="" />
      <div class="glow" id="glow2"></div>
    </div>
  </div>
</div>

<div class="controls">
  <button id="play">播放</button>
  <input id="scrub" type="range" min="0" max="1700" value="0" step="10" />
  <span class="time" id="time">0 ms</span>
</div>
<p class="note">V1：图标先柔焦散开，海报从模糊里对上焦，离场时再虚化交给首页。<br/>V2：海报一开始就是一层虚焦底，图标缩小时焦点从图标拉回海报，离场仍用虚焦收尾。</p>

<script>
  const $ = (id) => document.getElementById(id);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const smooth = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
  const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3);

  const DURATION = 1700;

  function setImg(el, { opacity, blur, scale }) {
    if (opacity !== undefined) el.style.opacity = opacity;
    if (blur !== undefined) el.style.filter = `blur(${blur}px)`;
    if (scale !== undefined) el.style.transform = `translate(-50%, -50%) scale(${scale})`;
  }

  function renderV1(t) {
    // 图标：80–600ms 柔焦散开；海报：60–580ms 从模糊里对焦
    const pIcon = smooth(t / 420);
    const icon = $('icon1');
    icon.style.opacity = 1 - pIcon;
    icon.style.filter = `blur(${30 * pIcon}px)`;
    icon.style.transform = `translate(-50%, -50%) scale(${1 + 2.2 * pIcon})`;

    const pIn = smooth((t - 30) / 450);
    const pOut = smooth((t - 1260) / 420);
    const poster = $('poster1');
    poster.style.opacity = pIn * (1 - pOut);
    poster.style.filter = `blur(${(22 * (1 - pIn) + 18 * pOut).toFixed(2)}px)`;
    poster.style.transform = `scale(${(1.05 - 0.05 * pIn + 0.02 * pOut).toFixed(4)})`;

    const pHome = smooth((t - 1330) / 370);
    const home = $('home1');
    home.style.opacity = pHome;
    home.style.transform = `scale(${(1.03 - 0.03 * pHome).toFixed(4)})`;
  }

  function renderV2(t) {
    // 海报一开始是压暗的虚焦底，颜色里带一点图标绿
    const pFocus = smooth(t / 650);
    const pOut = smooth((t - 1300) / 400);
    const poster = $('posterBlur2');
    poster.style.opacity = 1 - pOut;
    poster.style.filter = `blur(${(10 * (1 - pFocus) + 18 * pOut).toFixed(2)}px) brightness(${(0.6 + 0.4 * pFocus - 0.1 * pOut).toFixed(3)})`;
    poster.style.transform = `scale(${(1.04 - 0.04 * pFocus + 0.03 * pOut).toFixed(4)})`;

    // 绿色光晕从图标位置散开，焦点拉回海报后消失
    const pGlow = smooth(t / 700);
    const glow = $('glow2');
    glow.style.opacity = 0.45 * (1 - pGlow);
    glow.style.transform = `translate(-50%, -50%) scale(${0.8 + 1.5 * pGlow})`;

    const pHome = smooth((t - 1380) / 340);
    const home = $('home2');
    home.style.opacity = pHome;
    home.style.transform = `scale(${(1.03 - 0.03 * pHome).toFixed(4)})`;
  }

  function paintAt(t, variant) {
    t = clamp(Number(t) || 0, 0, DURATION);
    $('time').textContent = `${Math.round(t)} ms`;
    $('scrub').value = String(t);
    if (variant === '2') renderV2(t); else renderV1(t);
  }

  $('scrub').addEventListener('input', (e) => {
    const t = Number(e.target.value);
    paintAt(t, t > 900 ? '2' : '1');
  });
  $('play').addEventListener('click', () => {
    const start = performance.now();
    const tick = (now) => {
      const t = Math.min(DURATION, now - start);
      paintAt(t, '1');
      paintAt(t, '2');
      if (t < DURATION) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });

  paintAt(0, '1');
  paintAt(0, '2');
  window.renderAt = (t, variant = '1') => { paintAt(t, variant); };
</script>
</body>
</html>
